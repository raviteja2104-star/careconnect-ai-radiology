# Prometheus configuration for CareConnect.
# Mounted by docker-compose.yml into the `prometheus` service at
# /etc/prometheus/prometheus.yml (./infra/prometheus.yml — this file).
# NOTE: this file previously did not exist even though compose mounted it,
# which made Docker create an empty directory at the mount point.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Backend running inside the compose network (service name `backend`).
  - job_name: careconnect-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']
        labels:
          instance_kind: compose

  # Backend running directly on the HOST (npm run dev outside Docker).
  # host.docker.internal resolves to the host on Docker Desktop (Win/Mac).
  - job_name: careconnect-backend-host
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          instance_kind: host
